
<header th:fragment="header"
        class="border-bottom bg-light"
        xmlns:th="http://www.thymeleaf.org">

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">

            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center"
               th:href="@{/}">
                <img th:src="@{/images/logo.svg}"
                     alt="Logo"
                     width="40"
                     height="32"
                     class="me-2">

                <span class="fw-semibold text-white">
                    Users &amp; Roles
                </span>
            </a>

            <!-- Botón hamburguesa -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <!-- Menú principal -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}"
                           th:text="#{msg.nav.home}">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/users}"
                           th:text="#{msg.nav.users}">
                            Usuarios
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/roles}"
                           th:text="#{msg.nav.roles}">
                            Roles
                        </a>
                    </li>

                </ul>

                <!-- Selector de idioma -->
                <div class="d-flex align-items-center gap-2">

                    <label for="langSelect"
                           class="form-label mb-0"
                           th:text="#{msg.nav.language}">
                        Idioma
                    </label>

                    <select id="langSelect"
                            class="form-select form-select-sm"
                            style="width: auto;"
                            onchange="window.location.assign(window.location.pathname + '?lang=' + this.value)">

                        <option value="es"
                                th:selected="${#locale.language == 'es'}">
                            Español
                        </option>

                        <option value="en"
                                th:selected="${#locale.language == 'en'}">
                            English
                        </option>

                    </select>

                </div>

            </div>
        </div>
    </nav>
</header>
