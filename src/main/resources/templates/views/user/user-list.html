<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head (#{msg.user-list.title})"></head>

<body class="d-flex flex-column h-100">

<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="list-page">
    <div class="list-card">

        <h1 th:text="#{msg.user-list.title}"></h1>

        <a th:href="@{/users/new}" class="btn btn-success" th:text="#{msg.user-list.add}"></a>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <table class="table table-bordered table-striped mt-3">
            <thead>
            <tr>
                <th th:text="#{msg.user-list.id}"></th>
                <th th:text="#{msg.user-list.firstName}"></th>
                <th th:text="#{msg.user-list.lastName}"></th>
                <th th:text="#{msg.user-list.email}"></th>
                <th th:text="#{msg.user-list.roles}"></th>
                <th th:text="#{msg.user-list.actions}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${listUsers}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.firstName}"></td>
                <td th:text="${user.lastName}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <span class="badge bg-dark me-1" th:each="role : ${user.roles}" th:text="${role.name}"></span>
                </td>
                <td>
                    <a th:href="@{/users/edit(id=${user.id})}"
                       class="btn btn-primary btn-sm"
                       th:text="#{msg.user-list.edit}"></a>

                    <form th:action="@{/users/delete}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${user.id}"/>
                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                th:text="#{msg.user-list.delete}"
                                th:onclick="|return confirm('#{msg.user-list.confirm}');|"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.user-list.back}"></a>

    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
